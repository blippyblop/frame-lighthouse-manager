name: release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Native aarch64 build on a GitHub-hosted ARM64 runner (no emulation).
  # Bootstraps Valve's Holo Core aarch64 preview rootfs -- the Frame's actual
  # OS base -- and builds inside it, so the binary links against the exact
  # libraries the device ships and runs there without bundling anything.
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build + smoke test (Holo Core aarch64 rootfs, native)
        run: bash build_env/build_holo_aarch64.sh

      - name: Inspect built binary
        run: |
          file dist/lighthouse-pm-aarch64
          echo "=== NEEDED ==="
          readelf -d dist/lighthouse-pm-aarch64 | grep -E "NEEDED" || true
          echo "=== smoke log (tail) ==="
          tail -n 40 dist/smoke.log 2>/dev/null || true
          cp assets/icon.png dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pm-aarch64
          path: |
            dist/lighthouse-pm-aarch64
            dist/icon.png
            dist/smoke.log

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lighthouse-pm-aarch64
            dist/icon.png
          generate_release_notes: true

  # Self-contained flatpak (bundles the KDE platform runtime) for aarch64 KDE
  # desktops. Built natively on an ARM64 runner with flatpak-builder against
  # org.kde.Sdk -- no QEMU needed.
  flatpak-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build flatpak (aarch64, native)
        run: |
          flatpak-builder --user --force-clean --arch=aarch64 \
            dist/ build_env/flatpak/manifest.json

      - name: List bundle
        run: ls -la dist/

      - name: Upload flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pm-aarch64-flatpak
          path: dist/*.flatpak

      - name: Upload flatpak to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.flatpak
          generate_release_notes: false
