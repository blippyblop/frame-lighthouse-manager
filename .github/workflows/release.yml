name: release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:

# release steps (softprops/action-gh-release) need to create the release and
# upload assets; GITHUB_TOKEN defaults to read-only contents otherwise.
permissions:
  contents: write

jobs:
  # Native aarch64 build on a GitHub-hosted ARM64 runner (no emulation).
  # Bootstraps Valve's Holo Core aarch64 preview rootfs -- the Frame's actual
  # OS base -- and builds inside it, so the binary links against the exact
  # libraries the device ships and runs there without bundling anything.
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build + smoke test (Holo Core aarch64 rootfs, native)
        run: bash build_env/build_holo_aarch64.sh

      - name: Inspect built binary
        run: |
          file dist/lighthouse-pm-aarch64
          echo "=== NEEDED ==="
          readelf -d dist/lighthouse-pm-aarch64 | grep -E "NEEDED" || true
          echo "=== smoke log (tail) ==="
          tail -n 40 dist/smoke.log 2>/dev/null || true
          cp assets/icon.png dist/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pm-aarch64
          path: |
            dist/lighthouse-pm-aarch64
            dist/icon.png
            dist/smoke.log

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lighthouse-pm-aarch64
            dist/icon.png
          generate_release_notes: true

  # Self-contained flatpak (bundles the firmware glibc/Qt/KF6/Kirigami under
  # /app/rootfs) for aarch64 KDE desktops. Built natively on an ARM64 runner:
  # the same Holo Core rootfs the binary is built against is kept around and
  # used as the pristine library source for build_env/flatpak/stage.sh, which
  # stages the payload, commits it with ostree (including the xa.metadata key
  # flatpak's installer requires) and wraps it with `flatpak build-bundle`.
  flatpak-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree zstd

      - name: Build binary (Holo rootfs, kept for staging)
        env:
          KEEP_ROOTFS: "1"
          ROOTFS_DIR: /tmp/holo-rootfs
        run: bash build_env/build_holo_aarch64.sh

      - name: Stage + bundle flatpak
        run: |
          sh build_env/flatpak/stage.sh \
            /tmp/holo-rootfs /tmp/holo-rootfs \
            dist/lighthouse-pm-aarch64 dist/flatpak-stage
          ls -la dist/
          file dist/flatpak-stage/*.flatpak

      - name: Upload flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-pm-aarch64-flatpak
          path: dist/flatpak-stage/*.flatpak

      - name: Upload flatpak to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/flatpak-stage/*.flatpak
          generate_release_notes: false
